name: Transfer NotchPay webhook secret to Supabase

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Transfer secret without printing it
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          NOTCHPAY_WEBHOOK_HASH: ${{ secrets.NOTCHPAY_WEBHOOK_HASH }}
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_ACCESS_TOKEN" ]]; then
            echo "Missing GitHub Actions secret: SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
          if [[ -z "$NOTCHPAY_WEBHOOK_HASH" ]]; then
            echo "Missing GitHub Actions secret: NOTCHPAY_WEBHOOK_HASH"
            exit 1
          fi
          umask 077
          SECRET_FILE="$(mktemp)"
          trap 'rm -f "$SECRET_FILE"' EXIT
          printf 'NOTCHPAY_WEBHOOK_HASH=%s\n' "$NOTCHPAY_WEBHOOK_HASH" > "$SECRET_FILE"
          supabase secrets set --env-file "$SECRET_FILE" --project-ref uftjoubxaayggnwkbfro
          echo "Secret transfer command completed."
