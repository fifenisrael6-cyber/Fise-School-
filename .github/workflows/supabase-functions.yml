name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check Supabase deployment secrets
        id: config
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::Edge Function deployment blocked: configure SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF in GitHub Actions secrets."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Deploy gemini-chat
        if: steps.config.outputs.ready == 'true'
        run: supabase functions deploy gemini-chat --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy chapter-quiz
        if: steps.config.outputs.ready == 'true'
        run: supabase functions deploy chapter-quiz --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy index-course-file
        if: steps.config.outputs.ready == 'true'
        run: supabase functions deploy index-course-file --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy grade-assignment
        if: steps.config.outputs.ready == 'true'
        run: supabase functions deploy grade-assignment --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy notchpay-payment
        if: steps.config.outputs.ready == 'true'
        run: supabase functions deploy notchpay-payment --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy notchpay-callback
        if: steps.config.outputs.ready == 'true'
        run: supabase functions deploy notchpay-callback --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy send-push
        if: steps.config.outputs.ready == 'true'
        run: supabase functions deploy send-push --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy open-view-once
        if: steps.config.outputs.ready == 'true'
        run: supabase functions deploy open-view-once --project-ref "$SUPABASE_PROJECT_REF"
