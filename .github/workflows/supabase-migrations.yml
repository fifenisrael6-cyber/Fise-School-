name: Supabase Migrations

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL || secrets.SUPABASE_DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check database connection secret
        id: db
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Supabase migrations cannot run: configure SUPABASE_DB_URL (or SUPABASE_DATABASE_URL) in GitHub Actions secrets."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Apply migrations
        if: steps.db.outputs.ready == 'true'
        run: supabase db push --db-url "$SUPABASE_DB_URL"
