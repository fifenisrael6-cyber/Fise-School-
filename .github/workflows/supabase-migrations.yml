name: Supabase Migrations

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL || secrets.SUPABASE_DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check database connection secret
        id: db
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::Supabase migrations were not run because SUPABASE_DB_URL (or SUPABASE_DATABASE_URL) is not configured in GitHub Secrets. Configure it to enable automatic future migration deployment."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply migrations
        if: steps.db.outputs.ready == 'true'
        run: supabase db push --db-url "$SUPABASE_DB_URL"
