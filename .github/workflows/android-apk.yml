# Automatic rebuild trigger after media visibility fixes (2026-10-12).
# Relaunch Android build for the latest Fise School changes.
# Triggered again after pinning receive_sharing_intent to 1.8.1.
# Trigger Android build for the latest Fise School changes.
# Retry requested by the project owner.
# Rebuild after pinning Android Gradle Plugin 8.13.2 and Gradle 8.13 compatibility.
name: Build Android apk

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Install NDK before Gradle starts. Retry transient/corrupt SDK downloads
      # instead of letting Gradle fail during project configuration.
      - name: Install Android NDK with retry
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          NDK_VERSION="28.2.13676358"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager introuvable."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          for attempt in 1 2 3; do
            echo "Installation NDK $NDK_VERSION — tentative $attempt/3"
            rm -rf "$SDK_ROOT/ndk/$NDK_VERSION"
            if "$SDKMANAGER" --install "ndk;$NDK_VERSION"; then
              if [ -d "$SDK_ROOT/ndk/$NDK_VERSION" ]; then
                echo "NDK $NDK_VERSION installé."
                exit 0
              fi
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 15))
            fi
          done
          echo "::error::Impossible d'installer le NDK $NDK_VERSION après trois tentatives."
          exit 1

      - name: Write google-services.json (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          fi

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: Build APK
        run: >
          flutter build apk --release
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          --dart-define=NOTCHPAY_PUBLIC_KEY=${{ secrets.NOTCHPAY_PUBLIC_KEY }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fise-school-apk
          path: build/app/outputs/flutter-apk/app-release.apk
