name: Validate chapter course PDF Edge Function

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/process-chapter-course-pdf/**'
      - '.github/workflows/chapter-course-pdf-edge-check.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/process-chapter-course-pdf/**'
      - '.github/workflows/chapter-course-pdf-edge-check.yml'

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check Edge Function
        run: deno check supabase/functions/process-chapter-course-pdf/index.ts
