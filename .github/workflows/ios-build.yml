name: Fise School iOS Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'ios/**'
      - '.github/workflows/ios-build.yml'

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate missing iOS platform files safely
        shell: bash
        run: |
          set -euo pipefail
          cp pubspec.yaml "$RUNNER_TEMP/pubspec.yaml.original"
          if [ -f pubspec.lock ]; then cp pubspec.lock "$RUNNER_TEMP/pubspec.lock.original"; fi
          # Run in the existing project without --overwrite. This creates the missing
          # iOS scaffold while protecting the application's own pubspec and source.
          flutter create --platforms=ios --org com.fiseschool --project-name fise_school --no-pub .
          cp "$RUNNER_TEMP/pubspec.yaml.original" pubspec.yaml
          if [ -f "$RUNNER_TEMP/pubspec.lock.original" ]; then cp "$RUNNER_TEMP/pubspec.lock.original" pubspec.lock; fi
          test -f ios/Podfile
          test -f ios/Runner.xcodeproj/project.pbxproj
          test -f ios/Flutter/Debug.xcconfig
          test -f ios/Flutter/Release.xcconfig
          echo "iOS scaffold verified; application pubspec.yaml and pubspec.lock preserved."
          grep -E '^(  )?(supabase_flutter|drift|shared_preferences|path_provider|file_picker):' pubspec.yaml || true

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Install CocoaPods dependencies
        shell: bash
        run: |
          cd ios
          pod install --repo-update

      - name: Build unsigned iOS IPA
        run: flutter build ipa --release --no-codesign

      - name: Package iOS build outputs
        if: always()
        shell: bash
        run: |
          set -e
          mkdir -p build/ios/download
          [ ! -d build/ios/ipa ] || cp -R build/ios/ipa build/ios/download/
          [ ! -d build/ios/iphoneos ] || cp -R build/ios/iphoneos build/ios/download/
          [ ! -d build/ios/archive ] || cp -R build/ios/archive build/ios/download/
          if [ -n "$(find build/ios/download -mindepth 1 -print -quit 2>/dev/null)" ]; then
            cd build/ios/download
            zip -r "$GITHUB_WORKSPACE/Fise-School-iOS-build.zip" .
          fi

      - name: Upload iOS ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fise-School-iOS-${{ github.run_number }}
          path: |
            Fise-School-iOS-build.zip
            build/ios/ipa/*.ipa
          if-no-files-found: warn
          retention-days: 14
