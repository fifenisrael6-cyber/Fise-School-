name: Fise School iOS Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'ios/**'
      - '.github/workflows/ios-build.yml'

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Repair missing iOS platform files without touching app files
        shell: bash
        run: |
          set -euo pipefail
          scaffold="$RUNNER_TEMP/fise-school-ios-scaffold"
          flutter create --platforms=ios --org com.fiseschool --project-name fise_school "$scaffold"
          mkdir -p ios/Flutter
          if [ ! -f ios/Podfile ]; then cp "$scaffold/ios/Podfile" ios/Podfile; fi
          for file in Debug.xcconfig Release.xcconfig AppFrameworkInfo.plist; do
            if [ ! -f "ios/Flutter/$file" ]; then cp "$scaffold/ios/Flutter/$file" "ios/Flutter/$file"; fi
          done
          if [ ! -f ios/Runner.xcodeproj/project.pbxproj ]; then cp -R "$scaffold/ios/Runner.xcodeproj" ios/; fi
          if [ ! -f ios/Runner.xcworkspace/contents.xcworkspacedata ]; then
            mkdir -p ios/Runner.xcworkspace
            cp "$scaffold/ios/Runner.xcworkspace/contents.xcworkspacedata" ios/Runner.xcworkspace/
          fi
          if [ ! -f ios/Runner/Info.plist ]; then cp "$scaffold/ios/Runner/Info.plist" ios/Runner/; fi
          if [ ! -f ios/Runner/AppDelegate.swift ]; then cp "$scaffold/ios/Runner/AppDelegate.swift" ios/Runner/; fi
          if [ ! -f ios/Runner/Base.lproj/Main.storyboard ]; then
            mkdir -p ios/Runner/Base.lproj
            cp "$scaffold/ios/Runner/Base.lproj/Main.storyboard" ios/Runner/Base.lproj/
          fi
          if [ ! -f ios/Runner/Base.lproj/LaunchScreen.storyboard ]; then
            mkdir -p ios/Runner/Base.lproj
            cp "$scaffold/ios/Runner/Base.lproj/LaunchScreen.storyboard" ios/Runner/Base.lproj/
          fi
          echo "Confirming required app dependencies are still present:"
          grep -E '^  (supabase_flutter|drift|shared_preferences|path_provider|file_picker):' pubspec.yaml

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Install CocoaPods dependencies
        shell: bash
        run: |
          cd ios
          pod install --repo-update

      - name: Build unsigned iOS IPA
        run: flutter build ipa --release --no-codesign

      - name: Package iOS build outputs
        if: always()
        shell: bash
        run: |
          set -e
          mkdir -p build/ios/download
          [ ! -d build/ios/ipa ] || cp -R build/ios/ipa build/ios/download/
          [ ! -d build/ios/iphoneos ] || cp -R build/ios/iphoneos build/ios/download/
          [ ! -d build/ios/archive ] || cp -R build/ios/archive build/ios/download/
          if [ -n "$(find build/ios/download -mindepth 1 -print -quit 2>/dev/null)" ]; then
            cd build/ios/download
            zip -r "$GITHUB_WORKSPACE/Fise-School-iOS-build.zip" .
          fi

      - name: Upload iOS ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fise-School-iOS-${{ github.run_number }}
          path: |
            Fise-School-iOS-build.zip
            build/ios/ipa/*.ipa
          if-no-files-found: warn
          retention-days: 14
