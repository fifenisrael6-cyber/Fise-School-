name: Fise School iOS Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'ios/**'
      - '.github/workflows/ios-build.yml'

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate missing iOS platform files safely
        shell: bash
        run: |
          set -euo pipefail
          cp pubspec.yaml "$RUNNER_TEMP/pubspec.yaml.original"
          if [ -f pubspec.lock ]; then cp pubspec.lock "$RUNNER_TEMP/pubspec.lock.original"; fi
          # The existing iOS Runner project has no Podfile. Create the standard
          # Flutter CocoaPods integration file directly without regenerating app files.
          if [ ! -f ios/Podfile ]; then
            cat > ios/Podfile <<'PODFILE'
          platform :ios, '13.0'
          ENV['COCOAPODS_DISABLE_STATS'] = 'true'

          project 'Runner', {
            'Debug' => :debug,
            'Profile' => :release,
            'Release' => :release,
          }

          def flutter_root
            generated_xcode_build_settings_path = File.expand_path(File.join('..', 'Flutter', 'Generated.xcconfig'), __FILE__)
            unless File.exist?(generated_xcode_build_settings_path)
              raise "#{generated_xcode_build_settings_path} must exist. Run flutter pub get first"
            end
            File.foreach(generated_xcode_build_settings_path) do |line|
              matches = line.match(/FLUTTER_ROOT=(.*)/)
              return matches[1].strip if matches
            end
            raise "FLUTTER_ROOT not found in #{generated_xcode_build_settings_path}. Try deleting Generated.xcconfig, then run flutter pub get"
          end

          require File.expand_path(File.join('packages', 'flutter_tools', 'bin', 'podhelper'), flutter_root)
          flutter_ios_podfile_setup

          target 'Runner' do
            use_frameworks!
            use_modular_headers!
            flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))
          end

          post_install do |installer|
            installer.pods_project.targets.each do |target|
              flutter_additional_ios_build_settings(target)
            end
          end
          PODFILE
          fi
          test -f ios/Podfile
          test -f ios/Runner.xcodeproj/project.pbxproj
          test -f ios/Flutter/Debug.xcconfig
          test -f ios/Flutter/Release.xcconfig
          echo "iOS files verified; existing app project and pubspec files preserved."
          grep -E '^(  )?(supabase_flutter|drift|shared_preferences|path_provider|file_picker):' pubspec.yaml || true

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Install CocoaPods dependencies
        shell: bash
        run: |
          cd ios
          pod install --repo-update

      - name: Build unsigned iOS IPA
        run: flutter build ipa --release --no-codesign

      - name: Package iOS build outputs
        if: always()
        shell: bash
        run: |
          set -e
          mkdir -p build/ios/download
          [ ! -d build/ios/ipa ] || cp -R build/ios/ipa build/ios/download/
          [ ! -d build/ios/iphoneos ] || cp -R build/ios/iphoneos build/ios/download/
          [ ! -d build/ios/archive ] || cp -R build/ios/archive build/ios/download/
          if [ -n "$(find build/ios/download -mindepth 1 -print -quit 2>/dev/null)" ]; then
            cd build/ios/download
            zip -r "$GITHUB_WORKSPACE/Fise-School-iOS-build.zip" .
          fi

      - name: Upload iOS ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fise-School-iOS-${{ github.run_number }}
          path: |
            Fise-School-iOS-build.zip
            build/ios/ipa/*.ipa
          if-no-files-found: warn
          retention-days: 14
